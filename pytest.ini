[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . tests/fixtures
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Custom markers
markers =
    optional: marks tests that are optional and may be skipped in certain environments
    slow: marks tests that are slow to run
    real_api: marks tests that use real APIs instead of mocks
    integration: marks integration tests that test multiple components together 